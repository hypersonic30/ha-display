[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:tools/patch_ws.py
    pre:tools/version.py

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.4.0
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.3.0
    ; WebServer, DNSServer, HTTPClient are part of the ESP32 Arduino core

build_flags =
    -I include
    ; LVGL
    -D LV_CONF_INCLUDE_SIMPLE
    ; TFT_eSPI — pins from schematic; the controller is chosen per environment below
    -D USER_SETUP_LOADED
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_MISO=19
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=14
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SMOOTH_FONT
    ; HA pushes the initial entity snapshot as one WebSocket message
    -D WEBSOCKETS_MAX_DATA_SIZE=24576

; Two display controllers, same pins and touch. Pick the one printed on your panel / listed by the seller.
[env:ili9488]
build_flags =
    ${env.build_flags}
    -D ILI9488_DRIVER

[env:ili9481]
build_flags =
    ${env.build_flags}
    -D ILI9481_DRIVER
    ; If colors look wrong, try one of these (panels differ):
    ;   -D TFT_RGB_ORDER=TFT_BGR     red and blue swapped
    ;   -D TFT_INVERSION_ON          colors look like a negative
    ; If the picture is noisy, lower SPI_FREQUENCY (e.g. 20000000) in [env].
