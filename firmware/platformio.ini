[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.4.0
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.3.0
    ; WebServer, DNSServer, HTTPClient are part of the ESP32 Arduino core

build_flags =
    -I include
    ; LVGL
    -D LV_CONF_INCLUDE_SIMPLE
    ; TFT_eSPI — ILI9488, pins from schematic
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_MISO=19
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=35
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=14
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SMOOTH_FONT
