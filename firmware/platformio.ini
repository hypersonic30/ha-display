[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:tools/patch_ws.py
    pre:tools/version.py

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^8.4.0
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.3.0
    ; WebServer, DNSServer, HTTPClient are part of the ESP32 Arduino core

build_flags =
    -I include
    ; LVGL
    -D LV_CONF_INCLUDE_SIMPLE
    ; HA pushes the initial entity snapshot as one WebSocket message
    -D WEBSOCKETS_MAX_DATA_SIZE=24576

; Display, SPI pins and touch are configured at runtime (portal -> Hardware, docs/hardware.md). The two
; production variants only differ in the default controller, which is also the `variant` the integration uses
; to pick the OTA image. Pick the controller printed on your panel / listed by the seller.
[env:ili9488]
build_flags =
    ${env.build_flags}
    -D HW_DEFAULT_PANEL=1

[env:ili9481]
build_flags =
    ${env.build_flags}
    -D HW_DEFAULT_PANEL=0
